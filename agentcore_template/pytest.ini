[pytest]
# Pytest configuration for AgentCore template

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict marker checking
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Coverage options (uncomment to enable)
    # --cov=agent
    # --cov=scripts
    # --cov-report=html
    # --cov-report=term-missing
    # --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests that don't require AWS services
    integration: Integration tests that may require AWS services
    slow: Slow tests that take significant time to run
    aws: Tests that interact with AWS services

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (in seconds)
timeout = 300

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
