# Example configuration file for AgentCore template
# Copy this file to config.yaml and customize for your environment

# Application Configuration
application:
  # Application prefix - used for SSM parameter paths and resource naming
  prefix: myapp

  # Environment (dev, staging, prod)
  environment: dev

# AWS Configuration
aws:
  # AWS region
  region: us-east-1

  # AWS profile (optional - if not specified, uses default credentials)
  # profile: my-profile

# Bedrock Configuration
bedrock:
  # Model ID to use for the agent
  model_id: us.anthropic.claude-3-7-sonnet-20250219-v1:0

  # Alternative models (commented out)
  # model_id: us.anthropic.claude-3-5-sonnet-20241022-v2:0
  # model_id: anthropic.claude-3-haiku-20240307-v1:0

  # Model parameters
  max_tokens: 4096
  temperature: 0.7

# AgentCore Gateway Configuration
gateway:
  # Gateway URL (will be retrieved from SSM if not specified)
  # url: https://your-gateway-url.execute-api.us-east-1.amazonaws.com

  # Authentication method (oauth or iam)
  auth_method: oauth

  # Timeout for gateway requests (seconds)
  timeout: 30

# Memory Configuration
memory:
  # Memory ID (will be retrieved from SSM if not specified)
  # id: your-memory-id

  # Memory provider (agentcore, custom)
  provider: agentcore

  # Context window size
  context_window: 10

# Cognito Configuration (for OAuth authentication)
cognito:
  # User pool ID (will be retrieved from SSM if not specified)
  # user_pool_id: us-east-1_xxxxx

  # Client ID (will be retrieved from SSM if not specified)
  # client_id: xxxxxxxxxxxxxxxxxxxxx

  # Domain (will be retrieved from SSM if not specified)
  # domain: your-cognito-domain.auth.us-east-1.amazoncognito.com

# Agent Configuration
agent:
  # System prompt (optional - uses default if not specified)
  # system_prompt: "You are a helpful AI assistant..."

  # Tools to enable
  tools:
    - retrieve  # Knowledge base retrieval
    - current_time  # Current time tool
    # Add custom tools here

  # Tool configuration
  tool_config:
    max_tool_calls: 10
    tool_timeout: 30

# Retry Configuration
retry:
  # Maximum number of retry attempts
  max_retries: 3

  # Initial delay between retries (seconds)
  initial_delay: 1.0

  # Backoff factor for exponential backoff
  backoff_factor: 2.0

  # Maximum delay between retries (seconds)
  max_delay: 60.0

# Timeout Configuration
timeouts:
  # Agent invocation timeout (seconds)
  agent_invocation: 300

  # Gateway request timeout (seconds)
  gateway_request: 30

  # Memory operation timeout (seconds)
  memory_operation: 10

# Observability Configuration
observability:
  # Enable OpenTelemetry
  enabled: true

  # Enable console export for debugging
  console_export: true

  # Tool console mode (enabled, disabled, verbose)
  tool_console_mode: enabled

  # CloudWatch configuration
  cloudwatch:
    # Enable CloudWatch metrics
    metrics_enabled: true

    # Enable CloudWatch logs
    logs_enabled: true

    # Log group name
    log_group: /aws/agentcore/myapp

    # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
    log_level: INFO

# Logging Configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: INFO

  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  # Log to file
  file:
    enabled: true
    path: logs/agent.log
    max_bytes: 10485760  # 10MB
    backup_count: 5

  # Log to console
  console:
    enabled: true

# Security Configuration
security:
  # Input validation
  validation:
    # Maximum input length (characters)
    max_input_length: 10000

    # Enable input sanitization
    sanitize_input: true

  # Rate limiting
  rate_limiting:
    enabled: true
    max_requests_per_minute: 60

# Performance Configuration
performance:
  # Enable caching
  caching:
    enabled: true
    ttl: 300  # seconds

  # Connection pooling
  connection_pool:
    max_connections: 10
    keepalive: 30

# Health Check Configuration
health_check:
  # Enable health checks
  enabled: true

  # Health check interval (seconds)
  interval: 60

  # Components to check
  components:
    - ssm_connectivity
    - bedrock_availability
    - gateway_connectivity
    - memory_availability

# Feature Flags
features:
  # Enable streaming responses
  streaming: true

  # Enable memory persistence
  memory_persistence: true

  # Enable tool usage
  tools_enabled: true

  # Enable observability
  observability: true

# Development Configuration (only for dev environment)
development:
  # Enable debug mode
  debug: false

  # Mock external services
  mock_services: false

  # Reload on code changes
  auto_reload: false
